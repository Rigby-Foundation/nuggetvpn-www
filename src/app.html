<!doctype html>
<html lang="%lang%">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#14111e" />
		<script>
			try {
				var theme = JSON.parse(localStorage.getItem('kage-theme') || 'null');
				if (
					theme &&
					(theme.mode === 'light' || theme.mode === 'dark') &&
					[theme.bg, theme.surface, theme.accent].every(function (color) {
						return typeof color === 'string' && CSS.supports('color', color);
					})
				) {
					var root = document.documentElement;
					root.dataset.theme = theme.mode;
					root.style.setProperty('--theme-bg', theme.bg);
					root.style.setProperty('--theme-surface', theme.surface);
					root.style.setProperty('--theme-accent', theme.accent);
					document.querySelector('meta[name="theme-color"]').setAttribute('content', theme.bg);
				}
			} catch {}
		</script>
		<link rel="icon" type="image/png" href="%sveltekit.assets%/favicon.png" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icon.png" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
